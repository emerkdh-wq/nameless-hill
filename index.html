<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무명고지 분대전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 야전 상황판. 본부는 병적부(좌) + 작전 목록(우), 전투는 지도 한 장과 그 아래 분대 명령판. 단일 다크 테마(야전 천막 안 등불 아래). */
:root{
  color-scheme:dark;
  --bg:#191b14; --panel:#23261b; --panel2:#2c3022; --ink:#e7e1c8; --muted:#9d977c; --line:#444933;
  --accent:#c8a13a; --accent-ink:#1a1608; --olive:#7f9148; --danger:#d2604e; --blue:#6fa3c4;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 12px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.on{background:var(--olive);color:#12150a;border-color:var(--olive);font-weight:700}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font:600 10px var(--body);border:1px solid currentColor;border-radius:2px;padding:0 3px;opacity:.7;margin-left:4px}

/* 본부 */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;border-bottom:3px double var(--line);padding-bottom:10px}
.mast h1{font-size:34px;color:var(--accent);line-height:1.1}
.mast .unit{color:var(--muted);font-size:13px}
.mast .sp{flex:1}
.hq{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.hq{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:20px}
.sec-h small{color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sol{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sol.go{border-color:var(--olive)}
.sol.out{opacity:.72}
.sol .top{display:flex;align-items:center;gap:8px}
.rank{font-family:var(--display);color:var(--accent);font-size:15px;white-space:nowrap}
.nm{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);font:700 16px var(--body);padding:1px 2px}
.nm:hover{border-bottom-color:var(--muted)}
.role{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 8px;align-items:center;font-size:12px}
.stats .pips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.stats .pips i{height:8px;background:#15170f;border:1px solid var(--line)}
.stats .pips i.f{background:var(--olive);border-color:var(--olive)}
.stats .pips.lo i.f{background:var(--danger);border-color:var(--danger)}
.stats .pips.hi i.f{background:var(--blue);border-color:var(--blue)}
.stats b.lo{color:var(--danger)}.stats b.hi{color:var(--blue)}
.gear{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0}
.gear select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font:inherit;padding:2px 4px;max-width:100%}
.stp{white-space:nowrap}.stp b{display:inline-block;min-width:18px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.stp button{width:20px;height:20px;padding:0;line-height:1;background:var(--panel2);border:1px solid var(--line);border-radius:3px}
.wt{display:flex;align-items:center;gap:6px;flex:1 1 100%}.wt b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.wbar{flex:1;height:6px;background:#15170f;border:1px solid var(--line)}.wbar i{display:block;height:100%;background:var(--olive)}.wt.hv .wbar i{background:var(--accent)}
.uc .ft i{background:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs .btn{padding:4px 10px;font-size:13px}
.empty{color:var(--muted);margin:8px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.up{width:22px;height:22px;padding:0;line-height:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;font-weight:700}
.up:disabled{visibility:hidden}
.pts{color:var(--accent);font-weight:700}
.stats b{font-variant-numeric:tabular-nums;font-weight:500}
.sol .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sol .foot .sp{flex:1}
.tag{font-size:11px;border:1px solid currentColor;padding:0 5px;border-radius:2px;white-space:nowrap}
.tag.w{color:var(--danger)}
.ops{display:flex;flex-direction:column;gap:8px}
.op{background:var(--panel);border:1px solid var(--line);padding:10px 12px;text-align:left;display:block;width:100%}
.op.sel{border-color:var(--accent);background:var(--panel2)}
.op.lock{opacity:.45;cursor:not-allowed}
.op .d{font-size:11px;color:var(--muted);letter-spacing:.08em}
.star{color:#ffd23a;font-size:15px;line-height:1;text-shadow:0 0 2px #000}
.df{letter-spacing:0;white-space:nowrap;color:var(--olive)}.df.d3{color:var(--accent)}.df.d4,.df.d5{color:var(--danger)}
.op{padding:7px 12px}.op h3{font-size:17px;margin:1px 0 2px}
.op p{margin:0;font-size:12.5px;color:var(--muted)}
.op .ok{color:var(--olive);font-weight:700;font-size:12px}
.go-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.fallen{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.fallen li{margin:2px 0}
.help{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.help b{color:var(--ink)}

/* 전투 */
#battle{gap:8px}
.bar-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-top h2{font-size:18px;color:var(--accent)}
.obj{flex:1;min-width:200px;font-size:13px}
.obj b{color:var(--accent)}
.stage{position:relative;width:min(100%,calc((100vh - 235px)*1.647));min-width:min(100%,520px);margin:0 auto;border:1px solid var(--line);background:#000;line-height:0}
#cv{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
#log{position:absolute;left:8px;top:8px;font-size:12px;line-height:1.45;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none;max-width:60%}
#log div{transition:opacity .6s}
#lootmenu{position:absolute;z-index:3;background:rgba(20,22,14,.96);border:1px solid var(--accent);padding:8px;display:flex;flex-direction:column;gap:5px;line-height:1.4;font-size:12.5px;min-width:170px}
#lootmenu .btn{text-align:left;padding:5px 9px}
#banner{position:absolute;right:8px;top:8px;font:400 14px var(--display);color:var(--accent);background:rgba(0,0,0,.6);padding:3px 9px;line-height:1.4;pointer-events:none}
.ovl{position:absolute;inset:0;background:rgba(15,16,10,.88);display:flex;align-items:center;justify-content:center;line-height:1.55;padding:16px;overflow:auto}
.ovl .box{max-width:560px;display:flex;flex-direction:column;gap:10px}
.ovl h2{font-size:28px;color:var(--accent)}
.ovl p{margin:0}
.ovl ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.orders{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.orders .btn{padding:6px 10px;font-size:13px}
.squad{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.uc{background:var(--panel);border:1px solid var(--line);padding:6px 8px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:12px;min-width:0}
.uc.sel{border-color:var(--accent);background:var(--panel2)}
.uc.dn{opacity:.55}
.uc .num{font-family:var(--display);font-size:18px;color:var(--accent);grid-row:span 2}
.uc .un{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc .stt{color:var(--muted);white-space:nowrap}
.uc .uw{color:var(--muted);font-size:11px;grid-column:2/4;min-width:0}
.uc .bars{grid-column:1/4;display:flex;flex-direction:column;gap:2px}
.uc .b{height:4px;background:#15170f}
.uc .b i{display:block;height:100%}
.uc .hp i{background:var(--olive)} .uc .su i{background:var(--accent)}

/* 결과 */
.res h1{font-size:40px}
.res.win h1{color:var(--olive)} .res.lose h1{color:var(--danger)}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rp{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.rp.dead{border-color:var(--danger)}
.rp h3{font-size:17px}
.rp .g{color:var(--olive);font-size:13px}
.rp .s{font-size:12.5px;color:var(--muted)}
.rp .pr{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;border:1px solid var(--accent);color:var(--ink);padding:7px 14px;font-size:13px;z-index:20;pointer-events:none}
</style>
</head>
<body>

<div class="wrap" id="hq"></div>
<div class="wrap" id="battle" hidden>
  <div class="bar-top">
    <h2 id="b-title"></h2>
    <div class="obj" id="b-obj"></div>
    <button class="btn" id="b-pause">일시정지<kbd>Space</kbd></button>
    <button class="btn" id="b-speed">속도 ×1</button>
    <button class="btn" id="b-mute">소리 켬</button>
    <button class="btn warn" id="b-retreat">철수</button>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div id="log"></div>
    <div id="banner" hidden></div>
    <div id="lootmenu" hidden></div>
    <div class="ovl" id="brief"></div>
  </div>
  <div class="orders" id="orders">
    <button class="btn" data-o="walk">전진<kbd>Q</kbd></button>
    <button class="btn" data-o="run">질주<kbd>W</kbd></button>
    <button class="btn" data-o="sneak">포복<kbd>E</kbd></button>
    <button class="btn" data-o="aim" title="천천히 조준해 쏩니다. 명중률이 낮으면 쏘지 않습니다.">정밀사격<kbd>Z</kbd></button>
    <button class="btn" data-o="norm">일반사격<kbd>X</kbd></button>
    <button class="btn" data-o="supp" title="빠르게 퍼부어 적을 엎드리게 합니다. 탄약 소모가 큽니다.">제압사격<kbd>C</kbd></button>
    <button class="btn" data-o="reload" title="탄창이 비기 전에 미리 갈아 끼웁니다. 남은 탄은 예비탄으로 돌아갑니다.">장전<kbd>R</kbd></button>
    <button class="btn" data-o="gren">수류탄<kbd>G</kbd></button>
    <button class="btn" data-o="smoke" title="연막을 쳐서 30초 동안 시야를 가립니다.">연막탄<kbd>V</kbd></button>
    <button class="btn" data-o="hold">사격 중지<kbd>F</kbd></button>
    <button class="btn" data-o="stop">정지<kbd>S</kbd></button>
    <button class="btn" data-o="all">전원 선택<kbd>A</kbd></button>
    <button class="btn" data-o="flare" id="b-flare" hidden>조명탄<kbd>L</kbd></button>
  </div>
  <div class="squad" id="squad"></div>
</div>
<div class="wrap" id="debrief" hidden></div>
<div id="toast" hidden></div>

<script>
(()=>{'use strict';
const TS=20,MW=56,MH=34,CW=MW*TS,CH=MH*TS;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ───── 데이터 ───── */
const G=0,RD=1,TR=2,WL=3,SB=4,WA=5,PD=6,RB=7,TC=8,FL=9,RK=10,BS=11;
const TILE=[{n:'개활지',c:0,m:1},{n:'도로',c:0,m:.9},{n:'수목',c:.35,m:1.3},{n:'벽',c:0,m:0},{n:'사낭',c:.6,m:2.2},{n:'물',c:0,m:0},
  {n:'논',c:.1,m:1.7},{n:'잔해',c:.45,m:1.5},{n:'참호',c:.7,m:1.2},{n:'실내',c:.2,m:1},{n:'바위',c:0,m:0},{n:'덤불',c:.2,m:1.2}];
const WPN={
  garand:{n:'M1 개런드',range:22,rof:1.1,burst:1,acc:.5,dmg:48,clip:8,rel:2.8,sup:9,mags:10},
  carbine:{n:'M1 카빈',range:16,rof:.8,burst:1,acc:.45,dmg:34,clip:15,rel:3,sup:7,mags:5},
  bar:{n:'BAR 자동소총',range:22,rof:1.5,burst:4,acc:.3,dmg:46,clip:20,rel:4,sup:10,mags:7},
  sniper:{n:'M1903 저격총',range:34,rof:2.6,burst:1,acc:.85,dmg:78,clip:5,rel:4.5,sup:12,mags:7},
  mosin:{n:'모신나강',range:20,rof:1.9,burst:1,acc:.42,dmg:46,clip:5,rel:3.5,sup:8},
  ppsh:{n:'PPSh-41 기관단총',range:9,rof:1.1,burst:4,acc:.22,dmg:28,clip:36,rel:4,sup:7},
  dp:{n:'경기관총',range:24,rof:1.8,burst:6,acc:.14,dmg:44,clip:48,rel:6,sup:11},
  tt:{n:'권총',range:7,rof:1,burst:1,acc:.3,dmg:26,clip:8,rel:3,sup:4}};
// 총기별 발사음: [소음 중심 주파수, Q, 길이(초), 음량, 저음 타격 주파수, 저음 음량]
const SND={garand:[1500,.8,.16,.3,150,.28],carbine:[2300,1,.09,.22,220,.12],bar:[900,.7,.14,.32,110,.35],sniper:[1700,.6,.34,.36,130,.36],
  mosin:[1100,.7,.25,.3,120,.3],ppsh:[3000,1.4,.05,.16,300,.06],dp:[1300,.9,.11,.24,140,.22],tt:[2600,1.5,.06,.14,260,.08]};
for(const k in SND)WPN[k].snd=SND[k];
const ROLE={leader:{n:'분대장',w:'carbine',gren:2},rifle:{n:'소총수',w:'garand',gren:2},bar:{n:'자동소총수',w:'bar',gren:1},
  sniper:{n:'저격수',w:'sniper',gren:1},medic:{n:'의무병',w:'carbine',gren:1,kits:3},gren:{n:'척탄병',w:'garand',gren:5}};
const FM={aim:'정밀',norm:'일반',supp:'제압'};
// 장비: 총기(kg), 탄창 1개 무게, 수류탄 0.6kg, 구급낭 1kg. 휴대 한도는 체력에 비례한다.
const WT={garand:4.3,carbine:2.5,bar:8.8,sniper:4.0},CWT={garand:.25,carbine:.3,bar:.7,sniper:.15},GLIM={clips:[1,14],gren:[0,6],smoke:[0,3],kits:[0,3]};
const GT={leader:['carbine',5,2,0],rifle:['garand',10,2,0],bar:['bar',7,1,0],sniper:['sniper',8,1,0],medic:['carbine',5,1,3],gren:['garand',10,5,0],soldier:['garand',10,2,0]};
const gearWt=s=>{const g=s.gear;return WT[g.w]+CWT[g.w]*g.clips+g.gren*.6+(g.smoke||0)*.5+g.kits};
const gearCap=s=>10+s.st.hp*1.5;
function fitGear(s){const g=s.gear;while(gearWt(s)>gearCap(s)+1e-6){if(g.clips>3)g.clips--;else if(g.smoke>0)g.smoke--;else if(g.gren>0)g.gren--;else if(g.kits>0)g.kits--;else if(g.clips>1)g.clips--;else break}}
function gearOf(s){if(!s.gear){const t=GT[s.role]||GT.rifle;s.gear={w:t[0],clips:t[1],gren:t[2],kits:t[3]};if(s.role!=='leader')s.role='soldier';fitGear(s)}if(s.gear.smoke===undefined){s.gear.smoke=1;fitGear(s)}return s.gear}
// 출동하는 대원 중 계급이 가장 높은 병사가 분대장. 계급이 같으면 경험치가 많은 쪽.
const pickLeader=list=>list.slice().sort((a,b)=>rankOf(b.xp)-rankOf(a.xp)||b.xp-a.xp)[0];
const roleName=s=>({bar:'자동소총수',sniper:'저격수'}[s.gear.w]||'소총수')+(s.gear.kits?' · 의무':'');
const RANKS=['이병','일병','상병','병장','하사','중사','상사'],RXP=[0,60,150,280,450,700,1000];
const rankOf=xp=>{let r=0;for(let i=0;i<RXP.length;i++)if(xp>=RXP[i])r=i;return r};
const STN={hp:'체력',tough:'강인함',aim:'사격술',agi:'민첩성',per:'경계'};
const SUR='김이박최정강조윤장임한오서신권황안송류홍'.split('');
const GIV=['영수','철수','만석','덕구','봉수','상철','용팔','태식','종구','순돌','병태','춘삼','기철','동식','광수','재호','성칠','명환','인석','두만','학수','판돌','석구','복남','칠성','갑수'];

/* ───── 캠페인 ───── */
let C;const KEY='nameless_hill_v1';
function mkSoldier(role,vet){const s=()=>clamp(ri(3,6)+(vet?1:0),1,10);
  const st={hp:s(),tough:s(),aim:s(),agi:s(),per:s()},up=(k,n)=>st[k]=Math.min(10,st[k]+n);
  if(role==='sniper')up('aim',2);if(role==='leader'){up('tough',1);up('per',1)}if(role==='bar')up('hp',1);if(role==='medic')up('agi',1);
  const o={pts:0,id:C.nid++,name:pick(SUR)+pick(GIV),role,xp:role==='leader'?450:vet?ri(60,140):ri(0,30),st,missions:0,kills:0,out:0,dead:false,sel:false};gearOf(o);return o}
function newCampaign(){C={roster:[],done:{},count:0,fallen:[],nid:1,pick:0,pts:0};
  ['leader','rifle','rifle','bar','sniper','medic','gren','rifle','rifle'].forEach((r,i)=>C.roster.push(mkSoldier(r,i<4)));
  C.roster.slice(0,6).forEach(s=>s.sel=true)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.roster&&d.roster.length){C=d;C.pts=C.pts||0;for(const x of C.roster){gearOf(x);x.pts=x.pts||0;if(Object.values(x.st).some(v=>v>10))for(const k in x.st)x.st[k]=clamp(Math.round(x.st[k]/10),1,10)}return}}catch(e){}newCampaign()}
const alive=()=>C.roster.filter(s=>!s.dead);
const ready=s=>!s.dead&&s.out===0;
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ───── 본부 화면 ───── */
let resetArm=false,hqFilter='all';const MAXMEN=12;
function recruit(){const A=alive();if(A.length>=MAXMEN)return toast(`분대 정원은 ${MAXMEN}명입니다`);
  const role=!A.some(x=>x.gear.kits>0)?'medic':!A.some(x=>x.gear.w==='bar')?'bar':pick(['rifle','rifle','rifle','gren','sniper']);
  const n=mkSoldier(role,false);C.roster.push(n);if(C.roster.filter(x=>x.sel).length<6)n.sel=true;save();toast(`신병 ${n.name}(${roleName(n)}) 전입`);renderHQ()}
function renderHQ(){
  $('battle').hidden=true;$('debrief').hidden=true;const el=$('hq');el.hidden=false;
  C.roster.forEach(s=>{if(!ready(s))s.sel=false});
  const squad=C.roster.filter(s=>s.sel),ldr=pickLeader(squad);
  const stat=(s,k)=>`<span>${STN[k]}</span><span class="pips ${s.st[k]<=3?'lo':s.st[k]>=7?'hi':''}">${Array.from({length:10},(_,i)=>`<i class="${i<s.st[k]?'f':''}"></i>`).join('')}</span><b class="${s.st[k]<=3?'lo':s.st[k]>=7?'hi':''}">${s.st[k]}</b><button class="up" data-up="${s.id}:${k}" aria-label="${STN[k]} 올리기" title="${STN[k]} +1" ${(s.pts>0||C.pts>0)&&s.st[k]<10?'':'disabled'}>+</button>`;
  const F={all:alive(),ready:alive().filter(ready),hurt:alive().filter(x=>x.out>0)};
  const cards=(F[hqFilter]||[]).map(s=>{const r=rankOf(s.xp),nx=RXP[r+1];
    return`<article class="sol ${s.sel?'go':''} ${s.out?'out':''}">
      <div class="top">${s===ldr?'<span class="star" title="출동하는 대원 중 계급이 가장 높아 분대장을 맡습니다">★</span>':''}<span class="rank">${RANKS[r]}</span><input class="nm" id="nm-${s.id}" data-id="${s.id}" value="${esc(s.name)}" maxlength="8" aria-label="이름 수정" title="이름을 눌러 고칠 수 있습니다"></div>
      <div class="role">${roleName(s)} · ${WPN[s.gear.w].n} ${WPN[s.gear.w].clip*s.gear.clips}발</div>
      <div class="gear"><label>총기 <select id="gw-${s.id}" data-gw="${s.id}">${Object.keys(WT).map(k=>`<option value="${k}" ${k===s.gear.w?'selected':''}>${WPN[k].n} ${WT[k]}kg</option>`).join('')}</select></label>
        ${[['clips','탄창'],['gren','수류탄'],['smoke','연막탄'],['kits','구급낭']].map(([k,n])=>`<span class="stp">${n} <button data-gear="${s.id}:${k}:-1" aria-label="${n} 줄이기">−</button><b>${s.gear[k]}</b><button data-gear="${s.id}:${k}:1" aria-label="${n} 늘리기">+</button></span>`).join('')}
        <span class="wt ${gearWt(s)/gearCap(s)>.8?'hv':''}"><span class="wbar"><i style="width:${Math.min(100,gearWt(s)/gearCap(s)*100)}%"></i></span><b>${gearWt(s).toFixed(1)} / ${gearCap(s).toFixed(1)}kg</b></span></div>
      <div class="stats">${Object.keys(STN).map(k=>stat(s,k)).join('')}</div>

      <div class="help" style="margin-top:12px"><b>조작</b> — 왼쪽 클릭·끌기: 병사 선택 · 오른쪽 클릭: 이동, 적을 누르면 공격 · 숫자키 1–6: 병사 선택 · Space: 일시정지(정지 중에도 명령 가능)<br>
      <b>이동 방식</b> — 전진(Q) 보통 · 질주(W) 빠르지만 눈에 띔 · 포복(E) 느리지만 잘 안 맞고, 적이 알아채는 거리가 평소의 절반 이하로 줄어듦. 병사는 멈춰 있을 때만 사격합니다.<br>
      <b>탄약과 사격 방식</b> — 병사마다 휴대 탄약이 정해져 있고, 다 쓰면 쏘지 못합니다. 정밀사격(Z)은 천천히 조준해 잘 맞고 명중률 20% 미만이면 쏘지 않아 탄을 아낍니다. 일반사격(X)은 기본값입니다. 제압사격(C)은 두 배 가까이 빠르게 퍼부어 표적과 그 주변 적까지 엎드리게 하지만 잘 맞지 않고 탄약이 금방 바닥납니다. 탄약 상자 옆에 멈춰 서면 보급받습니다(상자당 16회).<br>
      <b>고장과 노획</b> — 총은 가끔 걸리고(몇 초 뒤 복구), 드물게 완전히 고장납니다. 겨울에는 더 자주 걸립니다. 탄약이 떨어졌거나 총이 고장난 병사는 쓰러진 적이나 쓰러진 아군을 오른쪽 클릭해 그 총과 탄약을 주워 쓸 수 있습니다. 총과 수류탄이 함께 있으면 무엇을 가져올지 고르는 창이 뜹니다(총, 수류탄만, 모두). 장전(R)을 누르면 탄창이 비기 전에 미리 갈아 끼웁니다. 아군 총은 탄약 상자로 보급도 됩니다.<br>
      <b>성장</b> — 능력치는 1~10입니다. 작전이 끝나면 분대 훈련 점수(성공 3, 실패 1)를 받아 아무 대원에게나 쓸 수 있고, 진급한 병사는 본인 전용 능력 점수 1점을 받습니다.<br>
      <b>철수</b> — 작전 도중 철수하면 걸을 수 있는 병사만 돌아옵니다. 쓰러진 병사는 부상자든 전사자든 적진에 남겨져 포로로 기록되고 분대에서 빠집니다.<br>
      <b>모퉁이</b> — 벽이나 바위 옆에 멈춰 선 병사는 알아서 모퉁이 밖으로 몸을 내밀어 살피고 쏩니다. 내민 동안에도 엄폐 60%를 받고, 쏠 상대가 없으면 벽 뒤에 숨어 보이지 않습니다. 옆으로 돌아와 몸통이 보이는 적에게는 엄폐가 통하지 않습니다. 적도 똑같이 모퉁이를 씁니다.<br>
      <b>백병전</b> — 적과 한 칸 남짓까지 붙으면 사격 대신 총검으로 싸웁니다. 민첩성과 강인함이 높을수록, 상대가 제압당해 있을수록 유리합니다. 네 칸 안의 적을 오른쪽 클릭하면 달려들어 찌르고, 탄약이 없거나 총이 고장난 병사는 거리와 상관없이 돌격합니다. 적도 가까워지면 달려듭니다.<br>
      <b>분대장</b> — 출동하는 대원 중 계급이 가장 높은 병사가 자동으로 분대장이 됩니다(계급이 같으면 경험이 많은 쪽). 병적부와 전투 화면에 ★ 표시가 붙습니다. 분대장 둘레 일곱 칸(지도의 점선 원) 안에 있는 대원은 제압을 30% 덜 받고 70% 빨리 회복합니다. 지휘를 받는 병사는 머리 옆에 노란 점이 붙습니다. 분대장이 쓰러지면 분대 전체가 크게 동요합니다.<br>
      <b>장비</b> — 병적부에서 병사마다 총기, 탄창, 수류탄, 구급낭 수를 정합니다. 휴대 한도는 10kg + 체력×1.5kg이고, 넘게는 들 수 없습니다. 무거울수록 느려지고 빨리 지칩니다(전투 카드의 파란 막대). 지치면 느려지고 명중률이 떨어지며, 탈진하면 뛰지 못합니다. 멈춰 서면 회복합니다. 병과는 든 총에 따라 소총수·자동소총수·저격수로 정해지고, 구급낭을 든 병사는 누구든 응급처치를 할 수 있습니다.<br>
      <b>충원</b> — 병적부의 「신병 충원」을 누르면 신병이 한 명 들어옵니다. 정원은 12명이고, 신병은 능력치가 낮습니다. 인원이 줄어도 자동으로 채워지지 않습니다.<br>
      <b>연막탄</b> — 연막탄(V)을 던지면 2초 뒤부터 30초 동안 지름 여섯 칸의 연막이 퍼집니다. 연막은 양쪽 모두의 시야와 사선을 막습니다. 연막 속에서는 바로 옆만 보입니다. 기관총 앞을 가로지르거나 부상병을 구하러 갈 때 쓰십시오. 병사마다 기본 한 발이고 장비에서 세 발까지 늘릴 수 있습니다(개당 0.5kg).<br>
      <b>공격 작전의 시작</b> — 공격·침투 작전에서는 분대가 포복 자세에 사격 중지 상태로 시작합니다. 들키지 않은 채로 계획을 세운 뒤 사격 중지(F)를 풀고 움직이십시오.<br>
      <b>제압</b> — 총알이 근처를 스치면 제압 수치가 오릅니다. 제압된 병사는 엎드려 꼼짝 못 하고, 공황에 빠지면 사격도 멈춥니다. 강인함이 높을수록 잘 버팁니다.<br>
      <b>부상</b> — 쓰러진 병사는 출혈로 죽기 전에 의무병을 선택하고 오른쪽 클릭해 응급처치하십시오. 터치 화면에서는 땅을 눌러 이동, 적을 눌러 공격합니다.</div></section></div>`;
}

let AC=null,NB=null,muted=false,lastShot=0;
function initAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function sfx(kind,vol=1){if(!AC||muted)return;try{const now=AC.currentTime;if(kind==='shot'){if(now-lastShot<.035)return;lastShot=now}
  const src=AC.createBufferSource();src.buffer=NB;const f=AC.createBiquadFilter(),g=AC.createGain();
  const P={shot:[.09,1800,.22,'bandpass'],boom:[.7,220,.6,'lowpass'],flare:[.5,3000,.12,'highpass'],stab:[.1,420,.3,'lowpass']}[kind];
  f.type=P[3];f.frequency.value=P[1]*(.8+Math.random()*.4);g.gain.setValueAtTime(P[2]*vol,now);g.gain.exponentialRampToValueAtTime(.001,now+P[0]);
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start(now,Math.random()*.5,P[0]+.05)}catch(e){}}

function gun(w,vol){if(!AC||muted)return;try{const now=AC.currentTime;if(now-lastShot<.02)return;lastShot=now;const[f,q,d,g,tf,tg]=w.snd;
  const src=AC.createBufferSource();src.buffer=NB;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*(.93+Math.random()*.14);bp.Q.value=q;
  const gn=AC.createGain();gn.gain.setValueAtTime(g*vol,now);gn.gain.exponentialRampToValueAtTime(.001,now+d);src.connect(bp);bp.connect(gn);gn.connect(AC.destination);src.start(now,Math.random()*.5,d+.05);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(tf,now);o.frequency.exponentialRampToValueAtTime(tf*.35,now+d*.8);
  og.gain.setValueAtTime(tg*vol,now);og.gain.exponentialRampToValueAtTime(.001,now+d*.8);o.connect(og);og.connect(AC.destination);o.start(now);o.stop(now+d)}catch(e){}}
// M1 개런드의 빈 클립이 튀어나오는 소리
function ping(){if(!AC||muted)return;try{const now=AC.currentTime+.06;for(const f of[2350,3900]){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.3);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+.32)}}catch(e){}}

let B=null;const cv=$('cv'),ctx=cv.getContext('2d');let DPR=1,bg=null,fogC=null,fogCtx=null;
const OFFS=[];for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)OFFS.push([x,y,Math.hypot(x,y)]);OFFS.sort((a,b)=>a[2]-b[2]);
const tileOf=(x,y)=>B.map[(y|0)*MW+(x|0)];
const tileAt=u=>B.map[(u.y|0)*MW+(u.x|0)];
const passable=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&TILE[B.map[y*MW+x]].m>0;
function nearFree(tx,ty,taken){for(const o of OFFS){const x=tx+o[0],y=ty+o[1];if(passable(x,y)&&!(taken&&taken.has(y*MW+x)))return{x,y}}return null}
function mkMap(sc){const m=new Uint8Array(MW*MH),r=mulberry(sc.seed);
  const M={set(x,y,t){if(x>=0&&y>=0&&x<MW&&y<MH)m[y*MW+x]=t},
   rect(t,x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,t)},
   scat(t,x,y,w,h,p,only=G){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<MW&&j<MH&&m[j*MW+i]===only&&r()<p)m[j*MW+i]=t},
   blob(t,cx,cy,rad){for(let j=cy-rad;j<=cy+rad;j++)for(let i=cx-rad;i<=cx+rad;i++)if(i>=0&&j>=0&&i<MW&&j<MH&&m[j*MW+i]===G&&Math.hypot(i-cx,j-cy)<rad*(.6+r()*.4))m[j*MW+i]=t},
   ring(t,x,y,w,h){for(let i=0;i<w;i++){this.set(x+i,y,t);this.set(x+i,y+h-1,t)}for(let j=0;j<h;j++){this.set(x,y+j,t);this.set(x+w-1,y+j,t)}},
   bld(x,y,w,h,doors){this.ring(WL,x,y,w,h);this.rect(FL,x+1,y+1,w-2,h-2);
    for(let i=1;i<w-1;i++){if(r()<.3)this.set(x+i,y,SB);if(r()<.3)this.set(x+i,y+h-1,SB)}
    for(let j=1;j<h-1;j++){if(r()<.3)this.set(x,y+j,SB);if(r()<.3)this.set(x+w-1,y+j,SB)}
    const mx=x+(w>>1),my=y+(h>>1);for(const d of doors){if(d==='N'){this.set(mx,y,FL);this.set(mx-1,y,FL)}if(d==='S'){this.set(mx,y+h-1,FL);this.set(mx-1,y+h-1,FL)}if(d==='W'){this.set(x,my,FL)}if(d==='E'){this.set(x+w-1,my,FL)}}}};
  sc.build(M);return m}

function findPath(sx,sy,tx,ty){sx|=0;sy|=0;tx|=0;ty|=0;
  if(!passable(tx,ty)){const n=nearFree(tx,ty);if(!n)return[];tx=n.x;ty=n.y}
  if(sx===tx&&sy===ty)return[];
  const N=MW*MH,g=new Float32Array(N).fill(1e9),from=new Int32Array(N).fill(-1),cl=new Uint8Array(N),f=new Float32Array(N);
  const s=sy*MW+sx,goal=ty*MW+tx;g[s]=0;f[s]=0;const open=[s];let found=false,it=0;
  while(open.length&&it++<20000){let bi=0;for(let i=1;i<open.length;i++)if(f[open[i]]<f[open[bi]])bi=i;
    const c=open[bi];open[bi]=open[open.length-1];open.pop();if(c===goal){found=true;break}if(cl[c])continue;cl[c]=1;
    const cx=c%MW,cy=(c/MW)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!passable(nx,ny))continue;
      if(dx&&dy&&(!passable(cx+dx,cy)||!passable(cx,ny)))continue;const n=ny*MW+nx;if(cl[n])continue;

      if(cp){const L=cp.loot;s=[L.w?`${L.w.n} ${L.n}발`:'',L.gren?`수류탄 ${L.gren}`:'',L.smoke?`연막탄 ${L.smoke}`:''].filter(Boolean).join(' · ')+' · 오른쪽 클릭으로 줍기'}else
      if(e&&u){const d=dist(u,e);s=d<4?'오른쪽 클릭: 총검 돌격':d>u.w.range?'사거리 밖':!sl(u,e)?'사선 막힘':`명중률 ${Math.round(hitChance(u,e)*100)}%`+(!los(u.x,u.y,e.x,e.y)?' · 모퉁이 사격':'')}
      else if(h.x>=0&&h.y>=0&&h.x<MW&&h.y<MH){const t=TILE[tileOf(h.x,h.y)];s=t.n+(t.c?` · 엄폐 ${Math.round(t.c*100)}%`:'')+(t.m?'':' · 통행 불가')}}
    if(s){ctx.font='11px sans-serif';ctx.textAlign='left';const w=ctx.measureText(s).width+10,bx=Math.min(x+12,CW-w-2),by=Math.min(y+12,CH-20);ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx,by,w,17);ctx.fillStyle='#fff';ctx.fillText(s,bx+5,by+12)}}}

function updHUD(force){if(!force&&B.hudT>0)return;B.hudT=.15;const ph=B.ph;let s='';
  const mm=t=>{t=Math.max(0,Math.ceil(t));return`${t/60|0}:${String(t%60).padStart(2,'0')}`};
  if(ph.type==='hold')s=` · 남은 시간 <b>${mm(ph.time-B.phT)}</b>`+(B.zones[0].lost>0?` · <b style="color:var(--danger)">진지 피탈 위기 ${mm(12-B.zones[0].lost)}</b>`:'');
  else if(ph.type==='capture')s=` · <b>${B.zones.filter(z=>z.cap).length}/${B.zones.length}</b> 점령`;
  $('b-obj').innerHTML=`<b>임무 ${B.phIdx+1}/${B.sc.phases.length}</b> ${ph.text}${s}`;
  $('b-pause').classList.toggle('on',B.paused&&B.started);$('b-speed').textContent='속도 ×'+B.speed;$('b-mute').textContent=muted?'소리 끔':'소리 켬';
  $('b-retreat').textContent=B.retreatArm>0?(B.pl.some(u=>u.state!=='ok')?'쓰러진 병사는 포로가 됩니다. 정말 철수?':'정말 철수? 다시 누르기'):'철수';
  if(B.night)$('b-flare').firstChild.textContent=`조명탄 ${B.flares}`;
  const S=[...B.sel],md=S.length?S[0].mode:null,fmd=S.length?S[0].fm:null;
  document.querySelectorAll('#orders [data-o]').forEach(b=>{const o=b.dataset.o;b.classList.toggle('on',o===md||o===fmd||((o==='gren'||o==='smoke')&&B.grenMode===o)||(o==='hold'&&S.length>0&&S.every(u=>u.holdFire)))});
  const cards=$('squad').children;B.pl.forEach((u,i)=>{const c=cards[i];if(!c)return;c.classList.toggle('sel',B.sel.has(u));c.classList.toggle('dn',!ok(u));
    const st=u.state==='dead'?'전사':u.state==='down'?(u.stab?'중상·안정':`출혈 ${mm(u.bleed)}`):u.supp>88?'공황':u.supp>55?'제압됨':u.healT>0?'치료 중':u.broken?'총기 고장':u.jamT>0?'기능 고장 처치':u.lootT>0&&u.lootTgt?'총기 노획 중':u.ammo<=0&&u.res<=0?'탄약 없음':u.reloadT>0?'재장전':u.moving?{walk:'전진',run:'질주',sneak:'포복'}[u.mode]:u.inMelee?'백병전':u.lean?'모퉁이 사격':u.target?'교전':u.holdFire?'사격 중지':'대기';
    c.children[2].textContent=st;c.children[2].style.color=u.state!=='ok'||u.supp>55||u.broken||(u.ammo<=0&&u.res<=0)?'var(--danger)':'';
    c.children[3].textContent=`${u.w.n} ${u.ammo}+${u.res}발 · ${FM[u.fm]}사격 · 수류탄 ${u.gren}${u.smoke?` · 연막 ${u.smoke}`:''}${u.kitsMax?` · 구급낭 ${u.kits}`:''}${u.fat>60?` · ${u.fat>90?'탈진':'지침'}`:''}`;
    c.children[4].children[0].firstChild.style.width=(u.hp/u.maxhp*100)+'%';c.children[4].children[1].firstChild.style.width=u.supp+'%';c.children[4].children[2].firstChild.style.width=(u.fat||0)+'%'})}

/* ───── 입력 ───── */
function evPt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*MW,y:(e.clientY-r.top)/r.height*MH}}
function unitAt(p,list,rad){let b=null,bd=rad;for(const u of list){const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<bd){bd=d;b=u}}return b}
function command(p){if(!B||B.over)return;const S=[...B.sel].filter(ok);if(!S.length)return;
  const e=unitAt(p,B.en.filter(u=>ok(u)&&u.vis),1);
  if(e){for(const u of S){u.forced=e;u.chase=true;u.healTgt=null;u.acqT=0}ftext(e,'공격 목표','#ff8a7a');say(S[0],'attack',1);return}
  const cp=unitAt(p,B.en.filter(u=>u.state==='dead'&&u.loot&&u.seen),.8);
  const doLoot=(cp,what)=>{const need=u=>(u.broken||(u.ammo<=0&&u.res<=0))?0:1,u=S.slice().sort((a,b)=>need(a)-need(b)||dist(a,cp)-dist(b,cp))[0];
    u.lootTgt=cp;u.lootWhat=what||'all';u.lootT=0;u.forced=null;u.chase=false;u.healTgt=null;u.path=findPath(u.x,u.y,cp.x,cp.y);ftext(cp,cp.side==='p'?'총기 인수 지시':'총기 노획 지시','#b8e0a0');say(u,cp.side==='p'?'lootf':'loot',1)};
  const ask=cp=>{const L=cp.loot,gun=L.w&&L.n>0,gr=L.gren>0||L.smoke>0;if(!(gun&&gr))return doLoot(cp,'all');const m=$('lootmenu'),gt=[L.gren?`수류탄 ${L.gren}`:'',L.smoke?`연막탄 ${L.smoke}`:''].filter(Boolean).join(', ');
    m.innerHTML=`<b>${cp.side==='p'?esc(cp.name):'적'}에게서 무엇을 가져올까요?</b><button class="btn" data-w="gun">총 · ${L.w.n} ${L.n}발</button><button class="btn" data-w="gren">${gt}만</button><button class="btn" data-w="all">모두</button><button class="btn" data-w="">취소</button>`;
    m.style.left=Math.min(78,p.x/MW*100)+'%';m.style.top=Math.min(62,p.y/MH*100)+'%';m.hidden=false;m.onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;m.hidden=true;if(b.dataset.w&&cp.loot)doLoot(cp,b.dataset.w);updHUD(true)}};
  if(cp){ask(cp);return}
  const fr=unitAt(p,B.pl.filter(u=>u.state!=='dead'),1),med=S.find(u=>u.kits>0);
  if(fr&&med&&fr!==med&&(fr.state==='down'&&!fr.stab||ok(fr)&&fr.hp<fr.maxhp)){med.healTgt=fr;med.healT=0;med.forced=null;med.path=findPath(med.x,med.y,fr.x,fr.y);ftext(fr,'응급처치 지시','#b8e0a0');say(med,'medic',1);return}
  const fb=unitAt(p,B.pl.filter(u=>u.state!=='ok'&&u.loot),.8);if(fb){ask(fb);return}
  const taken=new Set();for(const u of S){const d=nearFree(clamp(p.x|0,0,MW-1),clamp(p.y|0,0,MH-1),taken);if(!d)continue;taken.add(d.y*MW+d.x);u.path=findPath(u.x,u.y,d.x,d.y);u.forced=null;u.chase=false;u.healTgt=null;u.healT=0;u.lootTgt=null}
  say(S[0],S[0].mode==='run'?'run':S[0].mode==='sneak'?'sneak':'move',1)}
function grenadeAt(p){const sm=B.grenMode==='smoke',S=[...B.sel].filter(u=>ok(u)&&(sm?u.smoke:u.gren)>0&&u.supp<=88);let best=null,bd=9.5;
  for(const u of S){const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<bd&&los(u.x,u.y,p.x,p.y)){bd=d;best=u}}
  if(!best)return toast('던질 수 있는 병사가 없습니다 (사거리 9칸, 시선이 닿아야 함)');throwGren(best,p.x,p.y,sm);B.grenMode=false}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{try{window.focus()}catch(_){}$('lootmenu').hidden=true;if(!B||!B.started||B.over)return;const p=evPt(e);
  if(e.button===2){if(B.grenMode){B.grenMode=false;return}return command(p)}
  if(e.button===0){B.drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y,box:false,touch:e.pointerType==='touch',shift:e.shiftKey};try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(!B)return;const p=evPt(e);if(e.pointerType!=='touch')B.hover=p;const d=B.drag;if(d){d.x1=p.x;d.y1=p.y;if(!d.touch&&Math.hypot(d.x1-d.x0,d.y1-d.y0)>.5)d.box=true}});
cv.addEventListener('pointerleave',()=>{if(B)B.hover=null});
cv.addEventListener('pointerup',e=>{if(!B||!B.drag)return;const d=B.drag;B.drag=null;const p={x:d.x1,y:d.y1};
  if(d.box){if(!d.shift)B.sel.clear();const x0=Math.min(d.x0,d.x1),x1=Math.max(d.x0,d.x1),y0=Math.min(d.y0,d.y1),y1=Math.max(d.y0,d.y1);for(const u of B.pl)if(ok(u)&&u.x>=x0&&u.x<=x1&&u.y>=y0&&u.y<=y1)B.sel.add(u);return updHUD(true)}
  if(B.grenMode){grenadeAt(p);return updHUD(true)}
  const u=unitAt(p,B.pl.filter(ok),.9);
  if(u){if(d.shift){B.sel.has(u)?B.sel.delete(u):B.sel.add(u)}else{B.sel.clear();B.sel.add(u)}}
  else if(d.touch)command(p);else if(!d.shift)B.sel.clear();
  updHUD(true)});
function order(o){if(!B||!B.started||B.over)return;const S=[...B.sel].filter(ok);
  if(o==='all'){B.sel=new Set(B.pl.filter(ok))}
  else if(o==='walk'||o==='run'||o==='sneak'){if(!S.length)return toast('먼저 병사를 선택하십시오');S.forEach(u=>u.mode=o)}
  else if(FM[o]){if(!S.length)return toast('먼저 병사를 선택하십시오');S.forEach(u=>u.fm=o);say(S[0],o==='supp'?'fsupp':o,1)}
  else if(o==='reload'){let n=0;S.forEach(u=>{if(u.reloadT<=0&&u.ammo<u.w.clip&&u.res>0&&!u.broken){u.res+=u.ammo;u.ammo=0;u.burst=0;u.reloadT=u.w.rel*(1.2-u.agi/300);n++}});if(!S.length)return toast('먼저 병사를 선택하십시오');if(!n)return toast('장전할 필요가 없거나 예비 탄약이 없습니다');say(S[0],'reload',1)}
  else if(o==='gren'){if(!S.some(u=>u.gren>0))return toast('선택한 병사에게 수류탄이 없습니다');B.grenMode=B.grenMode==='gren'?false:'gren'}
  else if(o==='smoke'){if(!S.some(u=>u.smoke>0))return toast('선택한 병사에게 연막탄이 없습니다');B.grenMode=B.grenMode==='smoke'?false:'smoke'}
  else if(o==='hold'){const all=S.length&&S.every(u=>u.holdFire);S.forEach(u=>{u.holdFire=!all;if(u.holdFire){u.target=null;u.forced=null}});if(S.length&&!all)say(S[0],'hold',1)}
  else if(o==='stop'){S.forEach(u=>{u.path=[];u.forced=null;u.chase=false;u.healTgt=null});say(S[0],'stop',1)}
  else if(o==='flare'){if(!B.night||B.flares<=0)return toast('조명탄이 없습니다');if(B.flareT>0)return;B.flares--;B.flareT=22;B.light=.88;sfx('flare');log('조명탄 발사!','#ffe28a');say(B.pl.find(ok),'flare',1);computeVis()}
  updHUD(true)}
$('orders').addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(b)order(b.dataset.o)});
$('squad').addEventListener('click',e=>{const c=e.target.closest('.uc');if(!c||!B)return;const u=B.pl[+c.dataset.i];if(!ok(u)){const med=[...B.sel].find(m=>ok(m)&&m.kits>0);if(med&&u.state==='down')command(u);return}
  if(e.shiftKey){B.sel.has(u)?B.sel.delete(u):B.sel.add(u)}else{B.sel.clear();B.sel.add(u)}updHUD(true)});
function togglePause(){if(!B||!B.started||B.over)return;B.paused=!B.paused;$('banner').hidden=!B.paused;$('banner').textContent='일시정지 · 명령은 내릴 수 있습니다';updHUD(true)}
$('b-pause').onclick=togglePause;
$('b-speed').onclick=()=>{if(B){B.speed=B.speed===1?2:B.speed===2?.5:1;updHUD(true)}};
$('b-mute').onclick=()=>{muted=!muted;if(B)updHUD(true)};
$('b-retreat').onclick=()=>{if(!B||!B.started||B.over)return;if(B.retreatArm>0)endBattle(false,'철수했습니다',true);else{B.retreatArm=3;updHUD(true)}};
$('brief').addEventListener('click',e=>{if(e.target.id==='brief-go'){initAudio();$('brief').hidden=true;B.started=true;B.paused=false;B.sel=new Set(B.pl);updHUD(true)}});
window.addEventListener('keydown',e=>{if(!B||$('battle').hidden||!B.started||e.target.tagName==='INPUT')return;const k=e.code;
  const M={KeyQ:'walk',KeyW:'run',KeyE:'sneak',KeyG:'gren',KeyF:'hold',KeyS:'stop',KeyA:'all',KeyL:'flare',KeyR:'reload',KeyV:'smoke',KeyZ:'aim',KeyX:'norm',KeyC:'supp'};
  if(k==='Space'){e.preventDefault();togglePause()}else if(M[k]){e.preventDefault();order(M[k])}
  else if(/^(Digit|Numpad)[1-6]$/.test(k)){e.preventDefault();const u=B.pl[+k.slice(-1)-1];if(u&&ok(u)){if(!e.shiftKey)B.sel.clear();B.sel.add(u);updHUD(true)}}
  else if(k==='Escape'){B.grenMode=false;updHUD(true)}});

/* ───── 루프 ───── */
let last=0;function frame(ts){requestAnimationFrame(frame);const real=Math.min(.05,(ts-last)/1000||0);last=ts;if(!B||$('battle').hidden)return;
  if(B.started&&!B.paused&&!B.over){const dt=real*B.speed;update(dt);if(!B)return}
  B.rt+=real;for(const u of B.pl)if(u.say)u.say.t+=real;
  if(B.retreatArm>0){B.retreatArm-=real;if(B.retreatArm<=0)updHUD(true)}
  B.hudT-=real;updHUD();render()}
load();renderHQ();requestAnimationFrame(frame);
window.__game={get B(){return B},get C(){return C},SC,startBattle,update,endBattle,order,command};
})();
</script>
